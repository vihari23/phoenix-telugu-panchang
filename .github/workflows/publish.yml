name: Publish Phoenix Telugu Panchang ICS

on:
  push:
    branches: [main]
  schedule:
    # 1st of every month at 07:00 Phoenix time (MST).
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: phoenix-panchang-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout calendar source
        uses: actions/checkout@v4

      - name: Checkout Astro Chaganti calculation engine
        uses: actions/checkout@v4
        with:
          repository: socraticsurge/telugu-calendar-utilities
          ref: 7c5ebfb5222e3c2cda8024d3edae0073bfba3f77
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          enable-cache: true

      - name: Install locked upstream dependencies
        working-directory: engine
        run: uv sync --locked --no-dev

      - name: Test optional personal tithi planner
        run: |
          node --check site/personal.js
          PYTHONPATH=scripts:engine engine/.venv/bin/python -m unittest discover -s tests -p 'test_personal_tithi.py' -v

      - name: Generate and validate Phoenix ICS
        working-directory: engine
        run: PYTHONPATH=. .venv/bin/python ../scripts/generate_phoenix.py

      - name: Add calendar information page
        run: |
          cp site/index.html site/personal.html site/personal.js _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
